name: WareFlow AI CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint-and-test:
    name: Lint and Run Tests
    runs-on: ubuntu-latest

    services:
      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333

    env:
      QDRANT_HOST: localhost
      QDRANT_PORT: 6333
      QDRANT_COLLECTION_NAME: warehouse_sops

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Wait for Qdrant
        run: |
          echo "Waiting for Qdrant to become ready..."

          for i in {1..30}; do
            if curl -f http://localhost:6333/readyz; then
              echo ""
              echo "Qdrant is ready!"
              break
            fi

            echo "Qdrant not ready yet. Waiting..."
            sleep 2
          done

          curl -f http://localhost:6333/readyz

      - name: Run code validation
        run: |
          python -m compileall .

      - name: Run test discovery
        run: |
          pytest --collect-only
