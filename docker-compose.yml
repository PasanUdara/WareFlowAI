services:
  # WareFlow AI FastAPI Gateway & Agent Orchestrator
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wareflow_app
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - DEBUG=True
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - QDRANT_COLLECTION_NAME=warehouse_sops
      - GRID_WIDTH=20
      - GRID_HEIGHT=15
      - SIMULATION_TICK_RATE_HZ=2
      - NUM_ROBOTS=4
    env_file:
      - path: .env
        required: false
    depends_on:
      qdrant:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - wareflow_net

  # Qdrant Vector Database for SOP RAG retrieval
  qdrant:
    image: qdrant/qdrant:v1.8.4
    container_name: wareflow_qdrant
    ports:
      - "6333:6333" # REST API & Web UI dashboard
      - "6334:6334" # gRPC API
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:6333/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - wareflow_net

  # Warehouse Simulation Engine (Optional runner profile)
  simulation:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wareflow_simulation
    command: ["python", "-m", "simulation.sim_runner"]
    environment:
      - SIMULATION_TICK_RATE_HZ=2
      - NUM_ROBOTS=4
    profiles:
      - sim
      - full
    restart: on-failure
    networks:
      - wareflow_net

volumes:
  qdrant_storage:
    name: wareflow_qdrant_storage

networks:
  wareflow_net:
    name: wareflow_network
    driver: bridge
